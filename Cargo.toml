[package]
name = "wbuild"
version = "0.1.0"
edition = "2021"
description = "WBuild - Fast. Simple. Incremental. A modern general-purpose build system."
license = "MIT"
repository = "https://github.com/wjm13206/wbuild"
rust-version = "1.89"

[lib]
name = "wbuild"
path = "src/lib.rs"

[[bin]]
name = "wbuild"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true